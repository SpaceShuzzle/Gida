name: ci-go

on:
  pull_request:
    paths:
      - "packages/core-go/**"
      - "spec/**"
      # `verify-parity` owns vectors-only PRs; exclude that file here to avoid
      # duplicate runs. GitHub does not allow combining `paths` with
      # `paths-ignore`, so the exclusion must use a `!` pattern.
      - "!spec/vectors.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: cd packages/core-go && go test ./...
