name: ci-ts

on:
  pull_request:
    paths:
      - "packages/core-ts/**"
      - "spec/**"
      # `verify-parity` owns vectors-only PRs; exclude that file here to avoid
      # duplicate runs. GitHub does not allow combining `paths` with
      # `paths-ignore`, so the exclusion must use a `!` pattern.
      - "!spec/vectors.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter stellar-address-kit test
